<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Access Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; font-weight: 600; color: #f1f5f9; }
        .header h1 span { color: #3b82f6; }
        .header-status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #94a3b8; }
        .header-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; transition: transform 0.2s, border-color 0.2s; }
        .stat-card:hover { transform: translateY(-2px); border-color: #3b82f6; }
        .stat-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; color: #f1f5f9; }
        .stat-value.online { color: #22c55e; }
        .stat-value.offline { color: #ef4444; }
        .devices-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
        .section-header { padding: 20px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .section-header h2 { font-size: 18px; font-weight: 600; }
        .refresh-btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.2s; }
        .refresh-btn:hover { background: #2563eb; }
        .device-list { padding: 0; }
        .device-item { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid #334155; transition: background 0.2s; }
        .device-item:last-child { border-bottom: none; }
        .device-item:hover { background: #263348; }
        .device-icon { width: 48px; height: 48px; background: #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-right: 16px; font-size: 22px; }
        .device-info { flex: 1; }
        .device-name { font-size: 16px; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
        .device-details { font-size: 13px; color: #94a3b8; }
        .device-status { display: flex; align-items: center; gap: 8px; margin-right: 20px; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .status-badge.online { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-badge.offline { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .connect-btn { background: #22c55e; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; transition: background 0.2s; display: inline-block; }
        .connect-btn:hover { background: #16a34a; }
        .connect-btn.disabled { background: #475569; cursor: not-allowed; }
        .no-devices { padding: 40px; text-align: center; color: #64748b; }
        .last-updated { text-align: center; padding: 15px; font-size: 12px; color: #64748b; }
        .traffic-info { font-size: 12px; color: #64748b; margin-top: 4px; }
        .server-info { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; }
        .server-info h3 { font-size: 14px; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .info-item { display: flex; justify-content: space-between; font-size: 14px; }
        .info-item .label { color: #94a3b8; }
        .info-item .value { color: #e2e8f0; font-weight: 500; }
        .info-item a { color: #3b82f6; text-decoration: none; }
        .info-item a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>Remote</span> Access Dashboard</h1>
        <div class="header-status">
            <div class="dot" id="serverDot"></div>
            <span id="serverStatus">Checking server...</span>
        </div>
    </div>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Devices</div>
                <div class="stat-value" id="totalDevices">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Online</div>
                <div class="stat-value online" id="onlineDevices">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Offline</div>
                <div class="stat-value offline" id="offlineDevices">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">FRP Server</div>
                <div class="stat-value" id="frpStatus" style="font-size:20px">Checking...</div>
            </div>
        </div>
        <div class="server-info">
            <h3>Server Information</h3>
            <div class="info-grid">
                <div class="info-item"><span class="label">VPS IP</span><span class="value">93.127.138.82</span></div>
                <div class="info-item"><span class="label">FRP Port</span><span class="value">7000</span></div>
                <div class="info-item"><span class="label">API Port</span><span class="value">3000</span></div>
                <div class="info-item"><span class="label">Guacamole</span><span class="value"><a href="/guacamole/">Open Web RDP</a></span></div>
            </div>
        </div>
        <div class="devices-section">
            <div class="section-header">
                <h2>Connected Devices</h2>
                <button class="refresh-btn" onclick="refreshAll()">Refresh</button>
            </div>
            <div id="deviceList" class="device-list">
                <div class="no-devices">Loading devices...</div>
            </div>
            <div class="last-updated" id="lastUpdated"></div>
        </div>
    </div>
    <script>
        const API_BASE = window.location.protocol + "//" + window.location.hostname + ":3000";
        const GUACAMOLE_URL = window.location.protocol + "//" + window.location.hostname + ":8080/guacamole/";

        function formatBytes(bytes) {
            if (bytes === 0) return "0 B";
            const k = 1024, sizes = ["B", "KB", "MB", "GB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
        }

        function timeAgo(dateStr) {
            if (!dateStr) return "Never";
            const seconds = Math.floor((new Date() - new Date(dateStr)) / 1000);
            if (seconds < 60) return seconds + "s ago";
            if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
            if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
            return Math.floor(seconds / 86400) + "d ago";
        }

        async function fetchFrpProxies() {
            try {
                const r = await fetch(API_BASE + "/api/frp/proxies");
                if (r.ok) { const d = await r.json(); return d.proxies || []; }
            } catch (e) {}
            return [];
        }

        async function fetchApiHealth() {
            try {
                const r = await fetch(API_BASE + "/api/health");
                if (r.ok) {
                    document.getElementById("serverDot").style.background = "#22c55e";
                    document.getElementById("serverStatus").textContent = "Server Online";
                    return true;
                }
            } catch (e) {}
            document.getElementById("serverDot").style.background = "#ef4444";
            document.getElementById("serverStatus").textContent = "Server Offline";
            return false;
        }

        async function fetchApiDevices() {
            try {
                const r = await fetch(API_BASE + "/api/devices");
                if (r.ok) { const d = await r.json(); return d.devices || []; }
            } catch (e) {}
            return [];
        }

        async function refreshAll() {
            const [healthy, frpProxies, apiDevices] = await Promise.all([
                fetchApiHealth(), fetchFrpProxies(), fetchApiDevices()
            ]);

            const devices = [];
            let onlineCount = 0, offlineCount = 0;

            for (const proxy of frpProxies) {
                const isOnline = proxy.status === "online";
                if (isOnline) onlineCount++; else offlineCount++;
                const apiDev = apiDevices.find(d => proxy.name.includes(d.device_id));
                devices.push({
                    name: proxy.name, status: proxy.status,
                    remotePort: proxy.conf ? proxy.conf.remotePort : "N/A",
                    clientVersion: proxy.clientVersion || "Unknown",
                    trafficIn: proxy.todayTrafficIn || 0,
                    trafficOut: proxy.todayTrafficOut || 0,
                    curConns: proxy.curConns || 0,
                    lastStart: proxy.lastStartTime || "",
                    hostname: apiDev ? apiDev.hostname : "",
                    lastHeartbeat: apiDev ? apiDev.last_heartbeat : ""
                });
            }

            for (const dev of apiDevices) {
                if (!frpProxies.some(p => p.name.includes(dev.device_id))) {
                    offlineCount++;
                    devices.push({
                        name: dev.device_id, status: "offline",
                        remotePort: dev.remote_port || "N/A", clientVersion: "",
                        trafficIn: 0, trafficOut: 0, curConns: 0, lastStart: "",
                        hostname: dev.hostname || "", lastHeartbeat: dev.last_heartbeat || ""
                    });
                }
            }

            document.getElementById("totalDevices").textContent = onlineCount + offlineCount;
            document.getElementById("onlineDevices").textContent = onlineCount;
            document.getElementById("offlineDevices").textContent = offlineCount;
            document.getElementById("frpStatus").textContent = healthy ? "Running" : "Down";
            document.getElementById("frpStatus").style.color = healthy ? "#22c55e" : "#ef4444";

            const listEl = document.getElementById("deviceList");
            if (devices.length === 0) {
                listEl.innerHTML = '<div class="no-devices">No devices registered. Run Setup-RemoteAgent.bat on your Windows PC.</div>';
            } else {
                listEl.innerHTML = devices.map(d => {
                    const on = d.status === "online";
                    const name = d.hostname || d.name.replace("rdp-", "");
                    return '<div class="device-item">' +
                        '<div class="device-icon">' + (on ? '\uD83D\uDDA5\uFE0F' : '\u26AA') + '</div>' +
                        '<div class="device-info">' +
                            '<div class="device-name">' + name + '</div>' +
                            '<div class="device-details">Port: ' + d.remotePort +
                                (d.clientVersion ? ' | FRP v' + d.clientVersion : '') +
                                (d.curConns > 0 ? ' | ' + d.curConns + ' active connection(s)' : '') +
                                (d.lastStart ? ' | Started: ' + d.lastStart : '') +
                            '</div>' +
                            '<div class="traffic-info">Traffic In: ' + formatBytes(d.trafficIn) +
                                ' | Out: ' + formatBytes(d.trafficOut) +
                                (d.lastHeartbeat ? ' | Last heartbeat: ' + timeAgo(d.lastHeartbeat) : '') +
                            '</div>' +
                        '</div>' +
                        '<div class="device-status">' +
                            '<span class="status-badge ' + (on ? 'online' : 'offline') + '">' +
                                (on ? 'ONLINE' : 'OFFLINE') +
                            '</span>' +
                        '</div>' +
                        (on ? '<a href="' + GUACAMOLE_URL + '" class="connect-btn" target="_blank">Connect</a>' :
                               '<span class="connect-btn disabled">Offline</span>') +
                    '</div>';
                }).join('');
            }
            document.getElementById("lastUpdated").textContent = "Last updated: " + new Date().toLocaleString();
        }

        refreshAll();
        setInterval(refreshAll, 15000);
    </script>
</body>
</html>
