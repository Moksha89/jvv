# FRP Server Configuration
# This file configures the FRP server on the VPS relay

bindAddr = "0.0.0.0"
bindPort = 7000

auth.method = "token"
auth.token = "CHANGE_THIS_TO_A_SECURE_TOKEN"

transport.tls.force = false

webServer.addr = "127.0.0.1"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "CHANGE_THIS_ADMIN_PASSWORD"

log.to = "/var/log/frps/frps.log"
log.level = "info"
log.maxDays = 30
