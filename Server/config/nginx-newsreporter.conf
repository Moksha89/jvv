# News site on newsreporter.live (HTTPS)
server {
    listen 443 ssl;
    server_name newsreporter.live www.newsreporter.live;
    ssl_certificate /etc/letsencrypt/live/newsreporter.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsreporter.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    root /opt/remote-relay/newssite;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
    # Portal: ONLY accessible via reportersays cookie redirect, NOT direct URL
    location = /portal {
        if ($cookie_portal_auth != "granted") {
            return 302 /;
        }
        alias /opt/remote-relay/portal.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        default_type text/html;
    }
    location = /sarkar {
        alias /opt/remote-relay/newssite/admin.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        default_type text/html;
    }
    location = /admin {
        alias /opt/remote-relay/newssite/admin.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        default_type text/html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /guacamole/ {
        proxy_pass http://127.0.0.1:8080/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
    location /guacamole/websocket-tunnel {
        proxy_pass http://127.0.0.1:8080/guacamole/websocket-tunnel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}
# HTTP to HTTPS redirect for newsreporter.live
server {
    listen 80;
    server_name newsreporter.live www.newsreporter.live;
    return 301 https://$host$request_uri;
}
# IP-based access (keeps existing portal working on IP directly)
server {
    listen 80 default_server;
    server_name _;
    root /opt/remote-relay;
    location = / {
        try_files /portal.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
    # Block /portal on direct IP - redirect to homepage
    location = /portal {
        return 302 /;
    }
    location = /admin {
        alias /opt/remote-relay/newssite/admin.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        default_type text/html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /guacamole/ {
        proxy_pass http://127.0.0.1:8080/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
    location /guacamole/websocket-tunnel {
        proxy_pass http://127.0.0.1:8080/guacamole/websocket-tunnel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}
