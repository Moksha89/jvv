# ============================================================
# FRP Server Configuration - Example
# Copy this file to frps.toml and modify the values below
# ============================================================

bindAddr = "0.0.0.0"
bindPort = 7000

# IMPORTANT: Change this to a secure random token
# Generate with: openssl rand -hex 32
auth.method = "token"
auth.token = "YOUR_SECURE_AUTH_TOKEN_HERE"

transport.tls.force = false

# FRP admin dashboard (accessible only on localhost)
webServer.addr = "127.0.0.1"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "YOUR_DASHBOARD_PASSWORD_HERE"

log.to = "/var/log/frps/frps.log"
log.level = "info"
log.maxDays = 30
