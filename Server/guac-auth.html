<!DOCTYPE html>
<html>
<head><title>Connecting...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
.loading h2 { font-size: 22px; margin-bottom: 8px; }
.loading p { color: #888; font-size: 14px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(139,92,246,0.3); border-top-color: #8b5cf6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #ff6b6b; text-align: center; padding: 40px; }
/* Toolbar */
#rdp-toolbar { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: rgba(15,15,30,0.95); display: flex; align-items: center; padding: 0 12px; gap: 8px; z-index: 99999; transform: translateY(-100%); transition: transform 0.3s; border-bottom: 1px solid rgba(139,92,246,0.3); }
#rdp-toolbar.visible { transform: translateY(0); }
#rdp-toolbar .tb-btn { background: rgba(139,92,246,0.2); border: 1px solid rgba(139,92,246,0.4); color: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
#rdp-toolbar .tb-btn:hover { background: rgba(139,92,246,0.4); }
#rdp-toolbar .tb-title { font-size: 14px; font-weight: 600; color: #c4b5fd; margin-right: auto; }
#rdp-toolbar .tb-hint { font-size: 11px; color: #666; margin-left: auto; }
#toolbar-toggle { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 6px; background: rgba(139,92,246,0.5); border-radius: 0 0 6px 6px; cursor: pointer; z-index: 99998; transition: opacity 0.3s; }
#toolbar-toggle:hover { background: rgba(139,92,246,0.8); height: 8px; }
/* Guac iframe */
#guac-frame { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; display: none; }
#guac-frame.with-toolbar { top: 40px; height: calc(100vh - 40px); }
</style>
</head>
<body>
<div class="loading" id="loading-screen">
    <div class="spinner"></div>
    <h2>Connecting to remote desktop...</h2>
    <p>Please wait while we establish a secure connection</p>
</div>

<div id="toolbar-toggle" title="Show/hide toolbar"></div>
<div id="rdp-toolbar">
    <span class="tb-title" id="tb-conn-name">Remote Desktop</span>
    <button class="tb-btn" onclick="toggleFullscreen()" id="btn-fullscreen" title="Toggle fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Fullscreen
    </button>
    <button class="tb-btn" onclick="sendCtrlAltDel()" title="Send Ctrl+Alt+Delete">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M9 10h6m-3-3v6"/></svg>
        Ctrl+Alt+Del
    </button>
    <button class="tb-btn" onclick="toggleClipboard()" title="Clipboard sync">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        Clipboard
    </button>
    <button class="tb-btn" onclick="disconnectSession()" style="border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.15);" title="Disconnect">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Disconnect
    </button>
    <span class="tb-hint">Hover top edge to show toolbar</span>
</div>

<iframe id="guac-frame" allowfullscreen></iframe>

<div id="clipboard-panel" style="display:none;position:fixed;bottom:20px;right:20px;width:350px;background:rgba(15,15,30,0.97);border:1px solid rgba(139,92,246,0.4);border-radius:12px;padding:16px;z-index:100000;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-weight:600;font-size:14px;color:#c4b5fd;">Clipboard</span>
        <button onclick="toggleClipboard()" style="background:none;border:none;color:#888;cursor:pointer;font-size:18px;">&times;</button>
    </div>
    <textarea id="clipboard-text" style="width:100%;height:100px;background:rgba(0,0,0,0.3);border:1px solid rgba(139,92,246,0.3);border-radius:8px;color:#fff;padding:8px;font-size:13px;resize:vertical;" placeholder="Paste text here to send to remote desktop, or copy from here..."></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="tb-btn" onclick="sendClipboard()" style="flex:1;justify-content:center;">Send to Remote</button>
        <button class="tb-btn" onclick="getClipboard()" style="flex:1;justify-content:center;">Get from Remote</button>
    </div>
</div>

<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('client');
    var connName = params.get('name') || 'Remote Desktop';
    if (!clientId) { document.getElementById('loading-screen').innerHTML = '<div class="error"><h2>Error: No client specified</h2></div>'; return; }
    
    document.getElementById('tb-conn-name').textContent = connName;
    
    // Authenticate with Guacamole API
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/guacamole/api/tokens', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onload = function() {
        if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var token = data.authToken;
            // Store token
            window._guacToken = token;
            try { localStorage.setItem('GUAC_AUTH_TOKEN', '"' + token + '"'); } catch(e) {}
            // Load Guacamole client in iframe
            var guacUrl = '/guacamole/#/client/' + encodeURIComponent(clientId) + '?token=' + encodeURIComponent(token);
            var frame = document.getElementById('guac-frame');
            frame.src = guacUrl;
            frame.style.display = 'block';
            document.getElementById('loading-screen').style.display = 'none';
            // Focus iframe so keyboard input goes to RDP session
            frame.addEventListener('load', function() { frame.focus(); });
            setTimeout(function() { frame.focus(); }, 500);
        } else {
            document.getElementById('loading-screen').innerHTML = '<div class="error"><h2>Authentication failed</h2><p>' + xhr.responseText + '</p></div>';
        }
    };
    xhr.onerror = function() {
        document.getElementById('loading-screen').innerHTML = '<div class="error"><h2>Connection error</h2><p>Could not reach the server</p></div>';
    };
    // Always authenticate fresh with Guacamole API using credentials
    var gu = params.get('gu') || '';
    var gp = params.get('gp') || '';
    if (!gu || !gp) { document.getElementById('loading-screen').innerHTML = '<div class="error"><h2>Error: Missing auth credentials</h2></div>'; return; }
    xhr.send('username=' + encodeURIComponent(gu) + '&password=' + encodeURIComponent(gp));
})();

// Toolbar visibility
var toolbar = document.getElementById('rdp-toolbar');
var toggle = document.getElementById('toolbar-toggle');
var toolbarVisible = false;

toggle.addEventListener('click', function() {
    toolbarVisible = !toolbarVisible;
    toolbar.classList.toggle('visible', toolbarVisible);
    document.getElementById('guac-frame').classList.toggle('with-toolbar', toolbarVisible);
});

// Show toolbar on hover near top
document.addEventListener('mousemove', function(e) {
    if (e.clientY < 5 && !toolbarVisible) {
        toolbarVisible = true;
        toolbar.classList.add('visible');
        document.getElementById('guac-frame').classList.add('with-toolbar');
    }
});

// Auto-hide toolbar after 5 seconds of no interaction
var hideTimer = null;
toolbar.addEventListener('mouseleave', function() {
    hideTimer = setTimeout(function() {
        toolbarVisible = false;
        toolbar.classList.remove('visible');
        document.getElementById('guac-frame').classList.remove('with-toolbar');
    }, 3000);
});
toolbar.addEventListener('mouseenter', function() {
    if (hideTimer) clearTimeout(hideTimer);
});

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(e) {
            // Try iframe fullscreen
            document.getElementById('guac-frame').requestFullscreen().catch(function() {});
        });
    } else {
        document.exitFullscreen();
    }
}

function sendCtrlAltDel() {
    // Send Ctrl+Alt+Del via Guacamole API
    try {
        var frame = document.getElementById('guac-frame');
        if (frame.contentWindow) {
            // Try to access Guacamole client
            frame.contentWindow.postMessage({type: 'sendKeys', keys: ['ctrl', 'alt', 'del']}, '*');
        }
    } catch(e) {}
    alert('Ctrl+Alt+Del: Use Ctrl+Alt+Shift in the remote desktop to open Guacamole menu, then use the on-screen keyboard to send Ctrl+Alt+Del.');
}

var clipboardVisible = false;
function toggleClipboard() {
    clipboardVisible = !clipboardVisible;
    document.getElementById('clipboard-panel').style.display = clipboardVisible ? 'block' : 'none';
}

function sendClipboard() {
    var text = document.getElementById('clipboard-text').value;
    if (text) {
        navigator.clipboard.writeText(text).then(function() {
            alert('Text copied. Now use Ctrl+V in the remote desktop to paste.');
        });
    }
}

function getClipboard() {
    navigator.clipboard.readText().then(function(text) {
        document.getElementById('clipboard-text').value = text;
    }).catch(function() {
        alert('Could not read clipboard. Please paste manually into the text box.');
    });
}

function disconnectSession() {
    if (confirm('Disconnect from remote desktop?')) {
        window.close();
        // If window.close() doesn't work (not opened by script), navigate away
        setTimeout(function() { window.location.href = '/'; }, 500);
    }
}

// Click anywhere outside toolbar to refocus iframe for keyboard input
document.addEventListener('click', function(e) {
    if (!toolbar.contains(e.target) && !document.getElementById('clipboard-panel').contains(e.target)) {
        var frame = document.getElementById('guac-frame');
        if (frame) frame.focus();
    }
});

// Refocus iframe when mouse enters it
document.getElementById('guac-frame').addEventListener('mouseenter', function() {
    this.focus();
});
</script>
</body>
</html>
