<!DOCTYPE html>
<html>
<head><title>Connecting...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
.loading h2 { font-size: 22px; margin-bottom: 8px; }
.loading p { color: #888; font-size: 14px; }
.loading .status { color: #8b5cf6; font-size: 13px; margin-top: 12px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(139,92,246,0.3); border-top-color: #8b5cf6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #ff6b6b; text-align: center; padding: 40px; }
.error p { color: #aaa; margin-top: 8px; font-size: 14px; }
.error button { margin-top: 16px; background: rgba(139,92,246,0.3); border: 1px solid rgba(139,92,246,0.5); color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.error button:hover { background: rgba(139,92,246,0.5); }
#rdp-toolbar { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: rgba(15,15,30,0.95); display: flex; align-items: center; padding: 0 12px; gap: 8px; z-index: 99999; transform: translateY(-100%); transition: transform 0.3s; border-bottom: 1px solid rgba(139,92,246,0.3); }
#rdp-toolbar.visible { transform: translateY(0); }
#rdp-toolbar .tb-btn { background: rgba(139,92,246,0.2); border: 1px solid rgba(139,92,246,0.4); color: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
#rdp-toolbar .tb-btn:hover { background: rgba(139,92,246,0.4); }
#rdp-toolbar .tb-title { font-size: 14px; font-weight: 600; color: #c4b5fd; margin-right: auto; }
#rdp-toolbar .tb-hint { font-size: 11px; color: #666; margin-left: auto; }
#toolbar-toggle { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 6px; background: rgba(139,92,246,0.5); border-radius: 0 0 6px 6px; cursor: pointer; z-index: 99998; transition: opacity 0.3s; }
#toolbar-toggle:hover { background: rgba(139,92,246,0.8); height: 8px; }
#display { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; display: none; }
#display.with-toolbar { top: 40px; height: calc(100vh - 40px); }
</style>
<script src="/guacamole/guacamole-common-js/all.min.js"></script>
</head>
<body>
<div class="loading" id="loading-screen">
    <div class="spinner"></div>
    <h2>Connecting to remote desktop...</h2>
    <p>Please wait while we establish a secure connection</p>
    <p class="status" id="conn-status">Authenticating...</p>
</div>

<div id="toolbar-toggle" title="Show/hide toolbar"></div>
<div id="rdp-toolbar">
    <span class="tb-title" id="tb-conn-name">Remote Desktop</span>
    <button class="tb-btn" onclick="toggleFullscreen()" title="Toggle fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Fullscreen
    </button>
    <button class="tb-btn" onclick="sendCAD()" title="Send Ctrl+Alt+Delete">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M9 10h6m-3-3v6"/></svg>
        Ctrl+Alt+Del
    </button>
    <button class="tb-btn" onclick="toggleClipboard()" title="Clipboard sync">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        Clipboard
    </button>
    <button class="tb-btn" onclick="disconnectSession()" style="border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.15);" title="Disconnect">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Disconnect
    </button>
    <span class="tb-hint">Hover top edge to show toolbar</span>
</div>

<div id="display"></div>

<div id="clipboard-panel" style="display:none;position:fixed;bottom:20px;right:20px;width:350px;background:rgba(15,15,30,0.97);border:1px solid rgba(139,92,246,0.4);border-radius:12px;padding:16px;z-index:100000;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-weight:600;font-size:14px;color:#c4b5fd;">Clipboard</span>
        <button onclick="toggleClipboard()" style="background:none;border:none;color:#888;cursor:pointer;font-size:18px;">&times;</button>
    </div>
    <textarea id="clipboard-text" style="width:100%;height:100px;background:rgba(0,0,0,0.3);border:1px solid rgba(139,92,246,0.3);border-radius:8px;color:#fff;padding:8px;font-size:13px;resize:vertical;" placeholder="Paste text here to send to remote desktop, or copy from here..."></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="tb-btn" onclick="sendClipboardText()" style="flex:1;justify-content:center;">Send to Remote</button>
        <button class="tb-btn" onclick="getClipboardText()" style="flex:1;justify-content:center;">Get from Remote</button>
    </div>
</div>

<script>
var guacClient = null;
var guacKeyboard = null;

(function() {
    var params = new URLSearchParams(window.location.search);
    var clientId = params.get('client');
    var connName = params.get('name') || 'Remote Desktop';
    var statusEl = document.getElementById('conn-status');

    if (!clientId) {
        document.getElementById('loading-screen').innerHTML = '<div class="error"><h2>Error: No client specified</h2></div>';
        return;
    }

    document.getElementById('tb-conn-name').textContent = connName;
    document.title = connName + ' - Remote Desktop';

    var KNOWN_CONNECTIONS = { 'VARMA-PC': true, 'UAE-PC': true };

    function extractConnName(b64) {
        try { return atob(b64).split('\x00')[0] || null; } catch(e) { return null; }
    }

    function buildClientId(name) {
        return btoa(name + '\x00c\x00default');
    }

    var resolvedClientId = clientId;
    var extractedName = extractConnName(clientId);
    if (extractedName && KNOWN_CONNECTIONS[extractedName]) {
        resolvedClientId = buildClientId(extractedName);
    } else {
        var nameMap = { 'Varma PC': 'VARMA-PC', 'UAE Office PC': 'UAE-PC' };
        var guacConnName = nameMap[connName];
        if (guacConnName) resolvedClientId = buildClientId(guacConnName);
    }

    var decodedId = '';
    try { decodedId = atob(resolvedClientId); } catch(e) {}
    var idParts = decodedId.split('\x00');
    var guacId = idParts[0] || '';
    var guacType = idParts[1] || 'c';
    var guacDataSource = idParts[2] || 'default';

    var gu = params.get('gu') || '';
    var gp = params.get('gp') || '';
    if (!gu || !gp) {
        document.getElementById('loading-screen').innerHTML = '<div class="error"><h2>Error: Missing credentials</h2></div>';
        return;
    }

    statusEl.textContent = 'Authenticating...';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/guacamole/api/tokens', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onload = function() {
        if (xhr.status === 200) {
            var token = JSON.parse(xhr.responseText).authToken;
            statusEl.textContent = 'Authenticated. Opening tunnel...';
            startConnection(token, guacId, guacType, guacDataSource);
        } else {
            showError('Authentication failed', xhr.responseText);
        }
    };
    xhr.onerror = function() {
        showError('Connection error', 'Could not reach server.');
    };
    xhr.send('username=' + encodeURIComponent(gu) + '&password=' + encodeURIComponent(gp));

    function startConnection(token, id, type, dataSource) {
        var displayEl = document.getElementById('display');

        var connectParams = 'token=' + encodeURIComponent(token)
            + '&GUAC_DATA_SOURCE=' + encodeURIComponent(dataSource)
            + '&GUAC_ID=' + encodeURIComponent(id)
            + '&GUAC_TYPE=' + encodeURIComponent(type)
            + '&GUAC_WIDTH=' + Math.round(window.innerWidth)
            + '&GUAC_HEIGHT=' + Math.round(window.innerHeight)
            + '&GUAC_DPI=' + Math.round(96 * (window.devicePixelRatio || 1))
            + '&GUAC_TIMEZONE=' + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC')
            + '&GUAC_AUDIO=audio%2FL8&GUAC_AUDIO=audio%2FL16'
            + '&GUAC_IMAGE=image%2Fjpeg&GUAC_IMAGE=image%2Fpng&GUAC_IMAGE=image%2Fwebp';

        // Create tunnels: HTTP first (reliable through Cloudflare), WebSocket fallback
        var httpTunnel = new Guacamole.HTTPTunnel('/guacamole/tunnel');
        var wsProto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
        var wsTunnel = new Guacamole.WebSocketTunnel(wsProto + '//' + location.host + '/guacamole/websocket-tunnel');
        var tunnel = new Guacamole.ChainedTunnel(httpTunnel, wsTunnel);

        tunnel.onstatechange = function(state) {
            if (state === Guacamole.Tunnel.State.OPEN) {
                statusEl.textContent = 'Tunnel open, loading desktop...';
            }
        };

        guacClient = new Guacamole.Client(tunnel);

        guacClient.onstatechange = function(state) {
            switch(state) {
                case 0: statusEl.textContent = 'Idle...'; break;
                case 1: statusEl.textContent = 'Connecting...'; break;
                case 2: statusEl.textContent = 'Waiting for server...'; break;
                case 3:
                    document.getElementById('loading-screen').style.display = 'none';
                    displayEl.style.display = 'block';
                    document.title = connName;
                    break;
                case 4: statusEl.textContent = 'Disconnecting...'; break;
                case 5:
                    displayEl.style.display = 'none';
                    document.getElementById('loading-screen').style.display = 'flex';
                    showError('Disconnected', 'The remote desktop session has ended.');
                    break;
            }
        };

        guacClient.onerror = function(status) {
            showError('Connection Error (' + (status.code || '?') + ')', status.message || 'Unknown error');
        };

        tunnel.onerror = function(status) {
            showError('Tunnel Error (' + (status.code || '?') + ')', status.message || 'Could not establish tunnel.');
        };

        guacClient.onclipboard = function(stream, mimetype) {
            if (mimetype === 'text/plain') {
                var reader = new Guacamole.StringReader(stream);
                var data = '';
                reader.ontext = function(text) { data += text; };
                reader.onend = function() {
                    document.getElementById('clipboard-text').value = data;
                    try { navigator.clipboard.writeText(data); } catch(e) {}
                };
            }
        };

        var guacDisplay = guacClient.getDisplay().getElement();
        displayEl.innerHTML = '';
        displayEl.appendChild(guacDisplay);

        var mouse = new Guacamole.Mouse(guacDisplay);
        mouse.onEach(['mousedown', 'mouseup', 'mousemove'], function(e) {
            guacClient.sendMouseState(e.state);
        });

        var touch = new Guacamole.Mouse.Touchpad(guacDisplay);
        touch.onEach(['mousedown', 'mouseup', 'mousemove'], function(e) {
            guacClient.sendMouseState(e.state);
        });

        guacKeyboard = new Guacamole.Keyboard(document);
        guacKeyboard.onkeydown = function(keysym) { guacClient.sendKeyEvent(1, keysym); };
        guacKeyboard.onkeyup = function(keysym) { guacClient.sendKeyEvent(0, keysym); };

        guacClient.getDisplay().onresize = function(w, h) {
            var scale = Math.min(window.innerWidth / w, window.innerHeight / h, 1);
            guacClient.getDisplay().scale(scale);
        };

        window.addEventListener('resize', function() {
            if (guacClient) {
                guacClient.sendSize(Math.round(window.innerWidth), Math.round(window.innerHeight));
            }
        });

        statusEl.textContent = 'Opening tunnel...';
        guacClient.connect(connectParams);
    }

    function showError(title, msg) {
        document.getElementById('loading-screen').style.display = 'flex';
        document.getElementById('loading-screen').innerHTML =
            '<div class="error"><h2>' + title + '</h2><p>' + msg + '</p>'
            + '<button onclick="location.reload()">Retry</button>'
            + '<button onclick="window.location.href=\'/\'" style="margin-left:8px;">Dashboard</button></div>';
    }
})();

var toolbar = document.getElementById('rdp-toolbar');
var toggle = document.getElementById('toolbar-toggle');
var toolbarVisible = false;

toggle.addEventListener('click', function() {
    toolbarVisible = !toolbarVisible;
    toolbar.classList.toggle('visible', toolbarVisible);
    document.getElementById('display').classList.toggle('with-toolbar', toolbarVisible);
});

document.addEventListener('mousemove', function(e) {
    if (e.clientY < 5 && !toolbarVisible) {
        toolbarVisible = true;
        toolbar.classList.add('visible');
        document.getElementById('display').classList.add('with-toolbar');
    }
});

var hideTimer = null;
toolbar.addEventListener('mouseleave', function() {
    hideTimer = setTimeout(function() {
        toolbarVisible = false;
        toolbar.classList.remove('visible');
        document.getElementById('display').classList.remove('with-toolbar');
    }, 3000);
});
toolbar.addEventListener('mouseenter', function() { if (hideTimer) clearTimeout(hideTimer); });

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
    } else {
        document.exitFullscreen();
    }
}

function sendCAD() {
    if (guacClient) {
        guacClient.sendKeyEvent(1, 0xFFE3);
        guacClient.sendKeyEvent(1, 0xFFE9);
        guacClient.sendKeyEvent(1, 0xFFFF);
        guacClient.sendKeyEvent(0, 0xFFFF);
        guacClient.sendKeyEvent(0, 0xFFE9);
        guacClient.sendKeyEvent(0, 0xFFE3);
    }
}

var clipboardVisible = false;
function toggleClipboard() {
    clipboardVisible = !clipboardVisible;
    document.getElementById('clipboard-panel').style.display = clipboardVisible ? 'block' : 'none';
    if (guacKeyboard && clipboardVisible) guacKeyboard.reset();
}

function sendClipboardText() {
    var text = document.getElementById('clipboard-text').value;
    if (text && guacClient) {
        var stream = guacClient.createClipboardStream('text/plain');
        var writer = new Guacamole.StringWriter(stream);
        writer.sendText(text);
        writer.sendEnd();
    }
}

function getClipboardText() {
    navigator.clipboard.readText().then(function(text) {
        document.getElementById('clipboard-text').value = text;
    }).catch(function() {
        alert('Could not read clipboard. Paste manually into the text box.');
    });
}

function disconnectSession() {
    if (confirm('Disconnect from remote desktop?')) {
        if (guacClient) guacClient.disconnect();
        window.close();
        setTimeout(function() { window.location.href = '/'; }, 500);
    }
}

document.addEventListener('click', function(e) {
    if (!toolbar.contains(e.target) && !document.getElementById('clipboard-panel').contains(e.target)) {
        var el = document.getElementById('display');
        if (el) el.focus();
    }
});
</script>
</body>
</html>
